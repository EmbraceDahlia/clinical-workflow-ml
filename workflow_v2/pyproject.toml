[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-ml"
version = "2.0.0"
description = "Clinical workflow recommendation from longitudinal EHR data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "torch>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["jupyterlab>=4", "ipykernel>=6", "nbconvert>=7", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
