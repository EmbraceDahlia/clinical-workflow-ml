[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-ml"
version = "2.0.0"
description = "Clinical workflow recommendation from longitudinal EHR data"
requires-python = ">=3.11"
# Dependencies are listed once, in ../requirements.txt.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
